<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZigbeeMQ</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    :root {
      --bg: #161410;
      --panel: #211c16;
      --line: #3a3228;
      --text: #ece4d6;
      --muted: #9a8d7a;
      --accent: #d4a24c;
      --ok: #7aa86a;
      --off: #6b6256;
      --bad: #c45c4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.4rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: inherit;
      text-decoration: none;
    }
    .brand img {
      width: 36px;
      height: 36px;
      display: block;
      background: transparent;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: 0.03em; }
    h1 span { color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .header-end {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    #lang { flex: none; width: auto; font-size: 0.85rem; padding: 0.3rem 0.5rem; }
    .bar {
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid var(--line);
      align-items: center;
      flex-wrap: wrap;
    }
    button, .btn, select, input[type=text] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #1a140c; border-color: var(--accent); }
    button.danger { color: var(--bad); }
    button.danger:hover { border-color: var(--bad); }
    input[type=text] { min-width: 0; flex: 1; width: 100%; }
    select { color: var(--text); }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 0.9rem;
      padding: 1.1rem 1.4rem 2rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.9rem 4.4rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      position: relative;
    }
    .card-actions {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      display: flex;
      gap: 0.05rem;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      border: none;
      color: var(--muted);
      border-radius: 6px;
    }
    .icon-btn:hover { color: var(--accent); background: rgba(212, 162, 76, 0.12); }
    .icon-btn svg { width: 15px; height: 15px; }
    .card.pulse { animation: cardpulse 0.45s ease; }
    @keyframes cardpulse {
      0% { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      100% { border-color: var(--line); box-shadow: none; }
    }
    .click-action {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .card.pulse .click-action { animation: clickflash 0.45s ease; }
    @keyframes clickflash {
      0% { opacity: 0.35; }
      100% { opacity: 1; }
    }
    .unavail {
      color: var(--bad);
      background: rgba(196, 92, 74, 0.14);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      font-size: 0.85rem;
    }
    .unavail strong { font-weight: 600; }
    .card h2 { margin: 0; font-size: 1rem; }
    .kind { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 0.4rem; align-items: center; }
    .badge { background: var(--accent); color: #1a140c; border-radius: 999px; padding: 0.05rem 0.45rem; font-size: 0.65rem; letter-spacing: 0.06em; }
    .ieee { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--muted); word-break: break-all; }
    .row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex-shrink: 0; }
    .dot.on { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip { font-size: 0.68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.45rem; }
    .join { color: var(--accent); }
    .err { color: var(--bad); font-size: 0.8rem; }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 20;
    }
    .overlay.show { display: flex; }
    .dialog {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.2rem 1.2rem;
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .dialog h3 { margin: 0; font-size: 1.05rem; }
    .dialog label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
    .dialog .actions { justify-content: space-between; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/icon.png" alt="">
      <h1>Zigbee<span>MQ</span></h1>
    </a>
    <div class="header-end">
      <div class="meta" id="net">Connecting…</div>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>
  <div class="bar">
    <button class="primary" id="join" data-i18n="permitJoin">Permit join 60s</button>
    <button id="refresh" data-i18n="refresh">Refresh</button>
    <span class="meta join" id="join-status"></span>
  </div>
  <main id="list"></main>
  <div class="overlay" id="overlay">
    <form class="dialog" id="edit-form">
      <h3 id="edit-title">Device</h3>
      <div class="ieee" id="edit-ieee"></div>
      <label><span data-i18n="name">Name</span>
        <input type="text" id="edit-name" autocomplete="off" required>
      </label>
      <label><span data-i18n="type">Type</span>
        <select id="edit-kind"></select>
      </label>
      <div class="row actions">
        <button type="button" class="danger" id="edit-delete" data-i18n="remove">Remove</button>
        <span class="row">
          <button type="button" id="edit-cancel" data-i18n="cancel">Cancel</button>
          <button type="submit" class="primary" data-i18n="save">Save</button>
        </span>
      </div>
    </form>
  </div>

  <script>
    const LANGS = ["en", "ru", "de"];
    const STORAGE_KEY = "zigbeemq.lang";
    const LOCALES = {en: "en-US", ru: "ru-RU", de: "de-DE"};
    const kinds = ["light", "plug", "switch", "sensor", "motion", "unknown"];
    const I18N = {
      en: {
        connecting: "Connecting…",
        refresh: "Refresh",
        permitJoin: "Permit join 60s",
        joinOpen: "network open {n}s",
        net: "channel {channel} · PAN 0x{pan} · {n} devices",
        clickPrefix: "click:",
        waitingClick: "waiting for click",
        unavailable: "unavailable",
        occupancyOn: "motion detected",
        occupancyOff: "quiet",
        on: "on",
        off: "off",
        waiting: "waiting",
        "kind.light": "light",
        "kind.plug": "plug",
        "kind.switch": "switch",
        "kind.sensor": "sensor",
        "kind.motion": "motion",
        "kind.unknown": "device",
        "badge.new": "new",
        interviewHint: "Interview the device: model and clusters. Wake a sleeping sensor with a button.",
        interviewAria: "Interview device",
        edit: "Edit",
        onBtn: "On",
        offBtn: "Off",
        noLink: "no link to the device",
        device: "Device",
        name: "Name",
        type: "Type",
        remove: "Remove",
        cancel: "Cancel",
        save: "Save",
        deleteConfirm: "Remove “{name}” from the network?\nA sleeping device will still be dropped from the coordinator if it does not answer.",
        lang: "Language",
        "action.single": "single",
        "action.double": "double",
        "action.triple": "triple",
        "action.quadruple": "quadruple",
        "action.many": "many",
        "action.hold": "hold",
        "action.release": "release",
        "action.on": "on",
        "action.toggle": "toggle",
      },
      ru: {
        connecting: "подключение…",
        refresh: "Обновить",
        permitJoin: "Открыть сеть 60 с",
        joinOpen: "сеть открыта {n} с",
        net: "канал {channel} · PAN 0x{pan} · {n} устр.",
        clickPrefix: "клик:",
        waitingClick: "ожидание клика",
        unavailable: "недоступно",
        occupancyOn: "движение обнаружено",
        occupancyOff: "тихо",
        on: "вкл",
        off: "выкл",
        waiting: "ожидание",
        "kind.light": "лампа",
        "kind.plug": "розетка",
        "kind.switch": "кнопка",
        "kind.sensor": "датчик",
        "kind.motion": "движение",
        "kind.unknown": "устройство",
        "badge.new": "новое",
        interviewHint: "Опросить устройство: модель и кластеры. Спящий датчик нужно разбудить кнопкой.",
        interviewAria: "Опросить устройство",
        edit: "Изменить",
        onBtn: "Вкл",
        offBtn: "Выкл",
        noLink: "нет связи с устройством",
        device: "Устройство",
        name: "Имя",
        type: "Тип",
        remove: "Удалить",
        cancel: "Отмена",
        save: "Сохранить",
        deleteConfirm: "Удалить «{name}» из сети?\nСпящее устройство, если не ответит, будет снято с координатора.",
        lang: "Язык",
        "action.single": "одиночный",
        "action.double": "двойной",
        "action.triple": "тройной",
        "action.quadruple": "четверной",
        "action.many": "много",
        "action.hold": "удержание",
        "action.release": "отпускание",
        "action.on": "вкл",
        "action.toggle": "переключение",
      },
      de: {
        connecting: "Verbindung…",
        refresh: "Aktualisieren",
        permitJoin: "Beitritt 60 s",
        joinOpen: "Netzwerk offen {n} s",
        net: "Kanal {channel} · PAN 0x{pan} · {n} Geräte",
        clickPrefix: "Klick:",
        waitingClick: "warte auf Klick",
        unavailable: "nicht erreichbar",
        occupancyOn: "Bewegung erkannt",
        occupancyOff: "ruhig",
        on: "ein",
        off: "aus",
        waiting: "warte",
        "kind.light": "Lampe",
        "kind.plug": "Steckdose",
        "kind.switch": "Taster",
        "kind.sensor": "Sensor",
        "kind.motion": "Bewegung",
        "kind.unknown": "Gerät",
        "badge.new": "neu",
        interviewHint: "Gerät abfragen: Modell und Cluster. Schlafenden Sensor per Taster wecken.",
        interviewAria: "Gerät abfragen",
        edit: "Bearbeiten",
        onBtn: "Ein",
        offBtn: "Aus",
        noLink: "keine Verbindung zum Gerät",
        device: "Gerät",
        name: "Name",
        type: "Typ",
        remove: "Entfernen",
        cancel: "Abbrechen",
        save: "Speichern",
        deleteConfirm: "„{name}“ aus dem Netzwerk entfernen?\nEin schlafendes Gerät wird vom Coordinator genommen, auch wenn es nicht antwortet.",
        lang: "Sprache",
        "action.single": "einfach",
        "action.double": "doppelt",
        "action.triple": "dreifach",
        "action.quadruple": "vierfach",
        "action.many": "mehrfach",
        "action.hold": "halten",
        "action.release": "loslassen",
        "action.on": "ein",
        "action.toggle": "umschalten",
      },
    };

    const list = document.getElementById("list");
    const netEl = document.getElementById("net");
    const joinStatus = document.getElementById("join-status");
    const langSel = document.getElementById("lang");
    let devices = [];
    let permitUntil = 0;
    let netInfo = null;
    const seenAt = {};
    let lang = LANGS.includes(localStorage.getItem(STORAGE_KEY)) ? localStorage.getItem(STORAGE_KEY) : "en";

    function t(key, vars) {
      let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
      if (vars) {
        Object.keys(vars).forEach(k => { s = s.replaceAll("{" + k + "}", vars[k]); });
      }
      return s;
    }

    function actionLabel(action) {
      const key = "action." + action;
      if ((I18N[lang] && I18N[lang][key]) || I18N.en[key]) return t(key);
      return action;
    }

    function isUnavailableErr(msg) {
      return msg === "unavailable" || msg === "недоступно";
    }

    function formatTime(d) {
      const ms = d.last_seen_ms || Date.parse(d.last_seen) || 0;
      if (!ms) return "";
      return new Date(ms).toLocaleTimeString(LOCALES[lang] || "en-US", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function statusText(d) {
      if (d.last_click) {
        const clock = formatTime(d);
        return `${t("clickPrefix")} <span class="click-action">${escapeHtml(actionLabel(d.last_click))}</span>${clock ? " · " + clock : ""}`;
      }
      if (d.kind === "switch") return t("waitingClick");
      if (!d.reachable) return t("unavailable");
      if (d.occupancy === true) {
        const clock = formatTime(d);
        return `${t("occupancyOn")}${clock ? " · " + clock : ""}`;
      }
      if (d.occupancy === false) return t("occupancyOff");
      if (d.on === true) return t("on");
      if (d.on === false) return t("off");
      return t("waiting");
    }

    function showNet() {
      if (!netInfo) {
        netEl.textContent = t("connecting");
        return;
      }
      netEl.textContent = t("net", {
        channel: String(netInfo.channel),
        pan: Number(netInfo.pan_id).toString(16).toUpperCase(),
        n: String(devices.length),
      });
    }

    function fillKindSelect() {
      const cur = editKind.value;
      editKind.innerHTML = kinds.map(k => `<option value="${k}">${t("kind." + k)}</option>`).join("");
      if (cur) editKind.value = cur;
    }

    function applyStaticI18n() {
      document.documentElement.lang = lang;
      langSel.value = lang;
      langSel.setAttribute("aria-label", t("lang"));
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      fillKindSelect();
      if (overlay.classList.contains("show") && overlay.dataset.ieee) {
        const d = devices.find(x => x.ieee === overlay.dataset.ieee);
        editTitle.textContent = (d && d.name) || t("device");
      } else if (!overlay.classList.contains("show")) {
        editTitle.textContent = t("device");
      }
      showNet();
      tickJoin();
    }

    function setLang(next) {
      lang = LANGS.includes(next) ? next : "en";
      localStorage.setItem(STORAGE_KEY, lang);
      applyStaticI18n();
      render();
    }

    function render() {
      const sorted = [...devices].sort((a, b) =>
        (b.new ? 1 : 0) - (a.new ? 1 : 0) || (a.name || "").localeCompare(b.name || "", LOCALES[lang] || "en")
      );
      list.innerHTML = sorted.map(d => {
        const on = d.on === true;
        const showPower = d.has_on_off || d.kind === "light" || d.kind === "plug";
        const showLevel = d.has_level || d.kind === "light";
        const chips = (d.clusters || []).map(c => `<span class="chip">${escapeHtml(c)}</span>`).join("");
        const mark = String(d.last_seen_ms || d.last_seen || d.click_seq || "");
        const pulse = !!(mark && seenAt[d.ieee] && seenAt[d.ieee] !== mark);
        if (mark) seenAt[d.ieee] = mark;
        const offline = !d.reachable && d.kind !== "switch" && d.kind !== "motion";
        const rawErr = d.error && !isUnavailableErr(d.error) ? d.error : "";
        return `<article class="card${d.new ? " new" : ""}${pulse ? " pulse" : ""}">
          <div class="card-actions">
            <button class="icon-btn" data-act="interview" data-ieee="${d.ieee}" title="${escapeHtml(t("interviewHint"))}" aria-label="${escapeHtml(t("interviewAria"))}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
              </svg>
            </button>
            <button class="icon-btn" data-act="edit" data-ieee="${d.ieee}" title="${escapeHtml(t("edit"))}" aria-label="${escapeHtml(t("edit"))}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
            </button>
          </div>
          <div class="kind">
            <span>${t("kind." + (d.kind || "unknown"))}</span>
            ${d.new ? `<span class="badge">${t("badge.new")}</span>` : ""}
          </div>
          <h2>${escapeHtml(d.name || d.ieee)}</h2>
          <div class="ieee">${d.ieee} · nwk 0x${Number(d.nwk_addr).toString(16).padStart(4,"0")} · ${escapeHtml(d.manufacturer || "—")} ${escapeHtml(d.model || "")}</div>
          <div class="row">
            <span class="dot ${d.reachable ? (on || d.occupancy ? "on" : "") : "bad"}"></span>
            <span class="meta">${statusText(d)}</span>
          </div>
          ${showPower ? `<div class="row">
            <button data-act="on" data-ieee="${d.ieee}">${t("onBtn")}</button>
            <button data-act="off" data-ieee="${d.ieee}">${t("offBtn")}</button>
          </div>` : ""}
          ${showLevel ? `<input type="range" min="0" max="100" value="${d.brightness ?? 0}" data-act="bri" data-ieee="${d.ieee}">` : ""}
          ${offline ? `<div class="unavail"><strong>${t("unavailable")}</strong> · ${t("noLink")}</div>` : ""}
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${rawErr ? `<div class="err">${escapeHtml(rawErr)}</div>` : ""}
        </article>`;
      }).join("");
      if (netInfo) showNet();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function tickJoin() {
      if (!permitUntil) { joinStatus.textContent = ""; return; }
      const left = Math.max(0, Math.ceil((permitUntil - Date.now()) / 1000));
      joinStatus.textContent = left ? t("joinOpen", {n: String(left)}) : "";
      if (!left) permitUntil = 0;
    }

    async function loadNetwork() {
      const netRes = await fetch("/api/network", {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
      if (netRes) {
        netInfo = netRes;
        showNet();
      }
    }

    async function load() {
      const data = await fetch("/api/devices", {cache: "no-store"}).then(r => r.json());
      devices = data.devices || [];
      if (data.permit_until) {
        const clock = new Date(data.permit_until).getTime();
        permitUntil = clock > Date.now() ? clock : 0;
      }
      render();
    }

    const overlay = document.getElementById("overlay");
    const editForm = document.getElementById("edit-form");
    const editName = document.getElementById("edit-name");
    const editKind = document.getElementById("edit-kind");
    const editIeee = document.getElementById("edit-ieee");
    const editTitle = document.getElementById("edit-title");

    function openEdit(ieee) {
      const d = devices.find(x => x.ieee === ieee);
      if (!d) return;
      overlay.dataset.ieee = ieee;
      editTitle.textContent = d.name || t("device");
      editIeee.textContent = d.ieee + (d.model ? " · " + d.model : "");
      editName.value = d.name || "";
      editKind.value = d.kind || "unknown";
      overlay.classList.add("show");
      editName.focus();
      editName.select();
    }
    function closeEdit() {
      overlay.classList.remove("show");
      delete overlay.dataset.ieee;
    }

    async function api(url, opts) {
      const res = await fetch(url, opts);
      if (!res.ok) {
        let msg = res.statusText;
        try { const j = await res.json(); msg = j.error || msg; } catch {}
        throw new Error(msg);
      }
      return res;
    }

    async function saveMeta(ieee) {
      const name = editName.value.trim();
      const kind = editKind.value;
      await api(`/api/devices/${ieee}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, kind}),
      });
      closeEdit();
      await load();
    }

    list.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const ieee = btn.dataset.ieee;
      const act = btn.dataset.act;
      if (act === "edit") { openEdit(ieee); return; }
      btn.disabled = true;
      try {
        if (act === "on") await api(`/api/devices/${ieee}/on`, {method:"POST"});
        if (act === "off") await api(`/api/devices/${ieee}/off`, {method:"POST"});
        if (act === "interview") await api(`/api/devices/${ieee}/interview`, {method:"POST"});
        await load();
      } catch (err) {
        await load().catch(() => {});
        if (!isUnavailableErr(err.message)) alert(err.message);
      } finally { btn.disabled = false; }
    });
    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const ieee = overlay.dataset.ieee;
      if (!ieee) return;
      try { await saveMeta(ieee); }
      catch (err) { alert(err.message); }
    });
    document.getElementById("edit-cancel").onclick = closeEdit;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeEdit(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeEdit(); });
    document.getElementById("edit-delete").onclick = async () => {
      const ieee = overlay.dataset.ieee;
      const d = devices.find(x => x.ieee === ieee);
      if (!ieee || !d) return;
      if (!confirm(t("deleteConfirm", {name: d.name || ieee}))) return;
      try {
        await api(`/api/devices/${ieee}`, {method:"DELETE"});
        closeEdit();
        await load();
      } catch (err) {
        alert(err.message);
      }
    };
    list.addEventListener("change", async (e) => {
      const el = e.target;
      if (el.dataset.act !== "bri") return;
      try {
        await api(`/api/devices/${el.dataset.ieee}/brightness`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({percent: Number(el.value)}),
        });
        await load();
      } catch (err) {
        await load().catch(() => {});
        if (!isUnavailableErr(err.message)) alert(err.message);
      }
    });

    document.getElementById("join").onclick = async () => {
      await fetch("/api/permit-join", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({seconds:60})});
      permitUntil = Date.now() + 60000;
      tickJoin();
    };
    document.getElementById("refresh").onclick = async () => {
      await fetch("/api/refresh", {method:"POST"});
      await load();
      await loadNetwork();
    };
    langSel.addEventListener("change", () => setLang(langSel.value));

    function applyDevice(d) {
      const i = devices.findIndex(x => x.ieee === d.ieee);
      if (i < 0) devices.push(d);
      else devices[i] = d;
      render();
    }

    const es = new EventSource("/api/events");
    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      if (ev.type === "devices") { devices = ev.data || []; render(); }
      if (ev.type === "device") applyDevice(ev.data);
      if (ev.type === "removed" && ev.data) {
        devices = devices.filter(x => x.ieee !== ev.data.ieee);
        if (overlay.dataset.ieee === ev.data.ieee) closeEdit();
        render();
      }
      if (ev.type === "permit_join" && ev.data && ev.data.until) {
        permitUntil = new Date(ev.data.until).getTime();
        tickJoin();
      }
    };

    applyStaticI18n();
    setInterval(tickJoin, 1000);
    setInterval(() => { load().catch(() => {}); }, 2000);
    load().then(loadNetwork).catch(err => { netEl.textContent = err; });
  </script>
</body>
</html>
